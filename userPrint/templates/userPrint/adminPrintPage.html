
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"/>
    {% load static %}
    <script type="text/javascript" src="{% static 'userPrint/BrowserPrint-3.1.250.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'userPrint/BrowserPrint-Zebra-1.1.250.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'userPrint/GRLBrowserPrint.js' %}"></script>
</head>
<body>
<nav class="container-fluid">
    <ul>
        <li><strong>LPNsFE - Admin</strong></li>
    </ul>
    <ul>
        <li><a href="../" role="button">User Mode</a></li>
        <li><a href="../admin" role="button">Django Admin</a></li>
    </ul>
</nav>
<main class="container">
    <div class="grid">
        <section>
            <hgroup>
                <h2>Advanced LPN Printing</h2>
                <h3>Admin Controls</h3>
            </hgroup>
            <article>
                <details open>
                    <summary>Custom LPNs</summary>
                    <p>Print a single barcode label for a specific LPN.</p>
                    <form id="lpnForm" onsubmit="printCustomLPN(); return false;">
                        <fieldset role="group">
                            <input type="text" id="customLPN" name="customLPN" placeholder="Enter LPN" required>
                            <select id="selected_device" onchange="onDeviceSelected(this);" required></select>
                            <br/><br/>
                            <input type="button" value="Print" onclick="printCustomLPN()">
                            <br/><br/>
                        </fieldset>
                    </form>
                </details>
            </article>
            <!--
            <article>
                <details>
                    <summary>Any Number of LPNs</summary>
                    <form>
                        <fieldset role="group">
                            <input type="number" id="quantity" name="quantity" min="1" step="1" placeholder="Enter Quantity" required>
                            <select id="selected_device" onchange=onDeviceSelected(this); required></select><br/><br/>
                            <button type="submit">Print</button>
                        </fieldset>
                    </form>
                </details>
            </article>
            -->
            
            
            <div>
                <h3>Status:</h3>
                <p id="print_status" >Waiting for input...</p>
            </div>
        </section>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"/>
    {% load static %}
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('zebraWebPrintTheme') || 'dark');
    </script>
    <link rel="stylesheet" href="{% static 'userPrint/app.css' %}">
    <script type="text/javascript" src="{% static 'userPrint/theme.js' %}" defer></script>
    <script type="text/javascript" src="{% static 'userPrint/BrowserPrint-3.1.250.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'userPrint/BrowserPrint-Zebra-1.1.250.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'userPrint/GRLBrowserPrint.js' %}"></script>
        </head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong>LPNsFE</strong></li>
        </ul>
        <ul>
            <li><button id="theme_toggle" class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Switch theme"></button></li>
            <li><a href="adminPrint" role="button">Admin</a></li>
        </ul>
    </nav>
    <main class="container">
        <div class="grid">
            <section>
                <hgroup>
                    <h2>Lister/Tester LPN Printing</h2>
                    <h3>LPN Printing</h3>
                </hgroup>
                <p>Select Number of LPNs to print, which printer to print to, and click print.</p>
                <article>
                    <form id="lpnForm" method="post">
                        {% csrf_token %}
                        <fieldset role="group">
                            <select id="LPNquantity" required>
                                <option value="1">1</option>
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="100">100</option>
                                <option value="500">500</option>
                                <option value="1000">1000</option>
                            </select>
                            <select id="selected_device" onchange="onDeviceSelected(this);" required></select>
                            <input id="print_button" type="button" value="Print" onclick="getLPNs()">
                            <button id="stop_printer_button" class="stop-printer-button" type="button" onclick="stopSelectedPrinter()">Stop Printer</button>
                        </fieldset>
                    </form>
                </article>
                <div>
                    <h3>Status:</h3>
                    <p id="print_status" >Waiting for input...</p>
                </div>
            </section>
        </div>
    </main>
    <footer class="site-footer">
        <div class="container-fluid">
            <p class="footer-credit">Built by Megamind</p>
            <p class="footer-remark">Please don't break this</p>
        </div>
    </footer>
</body>
</html>
